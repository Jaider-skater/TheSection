        <div class="relative z-50" data-site-menu>
            <button type="button"
                    data-site-menu-btn
                    class="text-white hover:text-zinc-400 transition-colors p-2"
                    aria-label="Open menu"
                    aria-expanded="false">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-9 w-9" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16" />
                </svg>
            </button>
            <div data-site-menu-dropdown
                 class="hidden absolute right-0 mt-2 w-56 bg-zinc-900 border border-zinc-700 rounded-xl shadow-lg py-2 text-left">
                {% if request.endpoint != 'home' %}
                <a href="/" class="block px-4 py-3 text-sm hover:bg-zinc-800 transition-colors">Home</a>
                {% endif %}
                <a href="{{ url_for('legacy_portal') }}" class="block px-4 py-3 text-sm hover:bg-zinc-800 transition-colors">Member Portal</a>
                {% if show_staff_nav %}
                <a href="{{ url_for('verify_ticket') }}" class="block px-4 py-3 text-sm hover:bg-zinc-800 transition-colors">Door Scanner</a>
                <a href="{{ url_for('admin_dashboard') }}" class="block px-4 py-3 text-sm hover:bg-zinc-800 transition-colors">Tickets</a>
                <a href="{{ url_for('admin_events') }}" class="block px-4 py-3 text-sm hover:bg-zinc-800 transition-colors">Events</a>
                <a href="{{ url_for('admin_mailing_list') }}" class="block px-4 py-3 text-sm hover:bg-zinc-800 transition-colors">Mailing Lists</a>
                {% endif %}
                <form id="menu-logout-form"
                      method="POST"
                      action="{{ url_for('site_logout') }}"
                      class="border-t border-zinc-800 mt-1 pt-1 {% if not member_logged_in and not show_staff_nav %}hidden{% endif %}">
                    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
                    <input type="hidden" name="next" value="/">
                    <button type="submit"
                            class="w-full text-left block px-4 py-3 text-sm text-zinc-300 hover:bg-zinc-800 hover:text-white transition-colors">
                        Sign out
                    </button>
                </form>
            </div>
        </div>
        <script>
        (function () {
            var root = document.currentScript && document.currentScript.previousElementSibling;
            if (!root || !root.hasAttribute('data-site-menu')) {
                root = document.querySelector('[data-site-menu]');
            }
            if (!root || root.dataset.bound === '1') return;
            root.dataset.bound = '1';
            var btn = root.querySelector('[data-site-menu-btn]');
            var menu = root.querySelector('[data-site-menu-dropdown]');
            if (!btn || !menu) return;
            btn.addEventListener('click', function (e) {
                e.stopPropagation();
                menu.classList.toggle('hidden');
                btn.setAttribute('aria-expanded', menu.classList.contains('hidden') ? 'false' : 'true');
            });
            document.addEventListener('click', function (e) {
                if (!root.contains(e.target)) {
                    menu.classList.add('hidden');
                    btn.setAttribute('aria-expanded', 'false');
                }
            });
        })();
        </script>
