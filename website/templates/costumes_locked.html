<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Costume contest • The Section</title>
    <meta name="csrf-token" content="{{ csrf_token }}">
    <script src="{{ url_for('static', filename='js/tailwindcdn.js') }}"></script>
</head>
<body class="bg-zinc-950 text-white min-h-screen">

    <header class="bg-zinc-900">
        <div class="max-w-7xl mx-auto px-6 py-6 flex items-center justify-between">
            <div class="w-9"></div>
            <div>
                <a href="/">
                    <img id="site-logo"
                         src="{{ url_for('static', filename='images/TheSectionLogoDark.png') }}"
                         alt="The Section Logo"
                         class="h-20 w-auto">
                </a>
            </div>
            {% include 'site_menu.html' %}
        </div>
    </header>

    <main class="max-w-xl mx-auto px-6 pt-16 pb-20 text-center">
        <h1 class="text-4xl font-bold tracking-tight mb-4">Costume contest</h1>
        <p class="text-zinc-300 text-lg">{{ message }}</p>
        {% if not member %}
        <p class="text-zinc-500 mt-4">Already inside? Sign in with the account your ticket is on.</p>
        <a href="{{ url_for('legacy_portal', next='/costumes') }}"
           class="inline-block mt-6 px-6 py-3 bg-white text-black font-semibold rounded-2xl">Sign in</a>
        {% else %}
        <p class="text-zinc-500 mt-4">Make sure the ticket is saved to this account. Ask staff at the door if you need help.</p>
        <a href="/" class="inline-block mt-6 px-6 py-3 bg-zinc-800 text-white font-semibold rounded-2xl">Back home</a>
        {% endif %}
    </main>
</body>
</html>
