<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login • The Section</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-zinc-950 text-white min-h-screen p-6">
    <div class="max-w-md mx-auto flex justify-end mb-4">
        {% include 'site_menu.html' %}
    </div>
    <div class="max-w-md mx-auto">
        <div class="text-center mb-8">
            <h1 class="text-3xl font-bold mb-2">Admin</h1>
            <p class="text-zinc-400 text-sm">Staff email/password or admin key</p>
        </div>

        {% if error %}
        <div class="mb-6 bg-red-900/40 border border-red-500/50 rounded-2xl p-4 text-red-200 text-sm text-center">
            {{ error }}
        </div>
        {% endif %}

        <form method="POST" class="bg-zinc-900 border border-zinc-700 rounded-3xl p-8 space-y-5">
            <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
            <div>
                <label for="email" class="block text-sm text-zinc-400 mb-2">Staff email <span class="text-zinc-600">(optional if using admin key)</span></label>
                <input type="email" id="email" name="email" autocomplete="username"
                       class="w-full bg-zinc-950 border border-zinc-700 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-white">
            </div>
            <div>
                <label for="password" class="block text-sm text-zinc-400 mb-2">Password or admin key</label>
                <input type="password" id="password" name="password" required autocomplete="current-password"
                       class="w-full bg-zinc-950 border border-zinc-700 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-white">
            </div>
            <button type="submit"
                    class="w-full py-4 border-2 border-white bg-black text-white font-semibold rounded-2xl hover:bg-white hover:text-black transition-colors">
                Sign in
            </button>
        </form>
        <p class="text-center text-zinc-500 text-sm mt-6">
            <a href="/legacy" class="hover:text-white">← Member portal</a>
        </p>
    </div>
</body>
</html>
